<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>RP Studio</title>
  <style>
    :root {
      --bg-base: #131314;
      --bg-surface: #1e1f20;
      --bg-elevated: #282a2c;
      --glass-panel: rgba(30, 31, 32, 0.76);
      --glass-modal: rgba(24, 25, 27, 0.92);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-border-strong: rgba(255, 255, 255, 0.14);
      --text-primary: #e3e3e3;
      --text-secondary: #9aa0a6;
      --text-muted: #6e747a;
      --accent: #a8c7fa;
      --accent-bg: rgba(168, 199, 250, 0.14);
      --user-bubble: #2b2d30;
      --char-bubble: rgba(30, 31, 32, 0.65);
      --narrator-bubble: rgba(38, 40, 44, 0.55);
      --danger: #f28b82;
      --radius-pill: 999px;
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    #app-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-color: var(--bg-base);
      background-size: cover;
      background-position: center;
      transition: opacity 0.3s ease;
    }

    #app-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(19, 19, 20, 0.72);
    }

    #app {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      height: 100dvh;
      max-width: 820px;
      margin: 0 auto;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .glass {
      background: var(--glass-panel);
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      border: 1px solid var(--glass-border);
    }

    /* 顶部极简导航栏 */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      margin: 8px 12px 0;
      border-radius: var(--radius-pill);
      flex-shrink: 0;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .room-info {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
      overflow: hidden;
    }

    .room-title {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .room-subtitle {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-nav {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-secondary);
      padding: 5px 11px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .nav-btn:hover, .nav-btn:active {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--glass-border);
    }

    .nav-btn.highlight {
      color: var(--accent);
      background: var(--accent-bg);
    }

    /* 对话流容器 */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    #chat-container::-webkit-scrollbar {
      width: 4px;
    }
    #chat-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 4px;
    }

    .archive-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-muted);
      font-size: 11.5px;
      margin: 4px 0;
    }
    .archive-divider::before,
    .archive-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--glass-border);
    }

    .msg-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      opacity: 1;
      transition: opacity 0.2s ease;
    }

    .msg-row.archived {
      opacity: 0.52;
    }

    .msg-row.user {
      flex-direction: row-reverse;
    }

    .msg-row.narrator {
      justify-content: center;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--bg-elevated);
      border: 1px solid var(--glass-border-strong);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      margin-top: 2px;
    }

    .msg-main {
      max-width: calc(100% - 48px);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .msg-row.user .msg-main {
      align-items: flex-end;
      max-width: 82%;
    }

    .msg-row.narrator .msg-main {
      max-width: 96%;
      width: 100%;
    }

    .msg-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 4px;
    }

    .msg-sender {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .msg-badge {
      font-size: 10px;
      color: var(--text-muted);
    }

    .bubble {
      padding: 11px 16px;
      border-radius: var(--radius-lg);
      font-size: 15px;
      line-height: 1.68;
      color: var(--text-primary);
      word-break: break-word;
      white-space: pre-wrap;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .msg-row.char .bubble {
      background: var(--char-bubble);
      border: 1px solid var(--glass-border);
      border-top-left-radius: 6px;
    }

    .msg-row.user .bubble {
      background: var(--user-bubble);
      border: 1px solid var(--glass-border-strong);
      border-top-right-radius: 6px;
    }

    .msg-row.narrator .bubble {
      background: var(--narrator-bubble);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      color: #c4c7c5;
      font-size: 14px;
      padding: 10px 15px;
    }

    /* 动作与神态描写斜体样式 */
    .bubble em.action-text {
      color: var(--text-secondary);
      font-style: italic;
    }

    /* R1 思考过程折叠框 */
    .reasoning-details {
      margin-bottom: 8px;
      border-left: 2px solid var(--glass-border-strong);
      padding-left: 10px;
      font-size: 12.5px;
      color: var(--text-secondary);
    }
    .reasoning-details summary {
      cursor: pointer;
      user-select: none;
      color: var(--text-muted);
      font-size: 12px;
      margin-bottom: 4px;
    }

    /* 轻点气泡才展开的极简操作栏 */
    .msg-actions {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 2px 6px 0;
    }

    .msg-row.selected .msg-actions {
      display: flex;
    }

    .msg-row.selected .bubble {
      border-color: rgba(168, 199, 250, 0.35);
    }

    .action-link {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
      padding: 2px 0;
    }
    .action-link:hover {
      color: var(--text-primary);
    }
    .action-link.danger {
      color: var(--danger);
    }

    /* 底部 Gemini 风格胶囊输入区 */
    .bottom-area {
      padding: 6px 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .speaker-strip {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 0 4px;
    }
    .speaker-strip::-webkit-scrollbar {
      display: none;
    }

    .chip {
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      background: rgba(30, 31, 32, 0.7);
      border: 1px solid var(--glass-border);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .chip.active {
      color: #0b121e;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 600;
    }

    .chip.ghost {
      color: var(--accent);
      background: var(--accent-bg);
      border-color: rgba(168, 199, 250, 0.2);
    }

    .input-capsule {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 8px 10px 8px 16px;
      border-radius: 26px;
    }

    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 15px;
      line-height: 1.5;
      max-height: 120px;
      min-height: 24px;
      resize: none;
      font-family: inherit;
      padding: 4px 0;
    }

    #user-input::placeholder {
      color: var(--text-muted);
    }

    .icon-circle-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #0b121e;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    .icon-circle-btn:active {
      transform: scale(0.92);
    }

    .icon-circle-btn.stop {
      background: var(--danger);
      color: #1f0909;
    }

    .icon-circle-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* 模态弹窗系统 */
    .modal-mask {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.62);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .modal-mask.show {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 560px;
      max-height: 86dvh;
      background: var(--glass-modal);
      border: 1px solid var(--glass-border-strong);
      border-radius: var(--radius-xl);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 13px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
    }
    .close-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
    }

    .modal-body {
      padding: 16px 20px 22px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      -webkit-overflow-scrolling: touch;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .input, .textarea {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--glass-border-strong);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }

    .input:focus, .textarea:focus {
      border-color: var(--accent);
    }

    .textarea {
      min-height: 84px;
      resize: vertical;
      line-height: 1.55;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      background: var(--bg-elevated);
      border: 1px solid var(--glass-border-strong);
      color: var(--text-primary);
      padding: 7px 14px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn.primary {
      background: var(--accent);
      color: #0b121e;
      border-color: var(--accent);
      font-weight: 600;
    }

    .btn.danger {
      background: rgba(242, 139, 130, 0.12);
      color: var(--danger);
      border-color: rgba(242, 139, 130, 0.3);
    }

    .card-item {
      background: var(--bg-surface);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .card-meta {
      flex: 1;
      min-width: 0;
    }

    .card-name {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-tag {
      font-size: 11px;
      padding: 1px 8px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-secondary);
      font-weight: 400;
    }

    .status-tag.on {
      background: var(--accent-bg);
      color: var(--accent);
    }

    .card-desc {
      font-size: 12.5px;
      color: var(--text-secondary);
      margin-top: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .note {
      font-size: 12px;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      padding: 10px 12px;
      border-radius: var(--radius-md);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="app-bg"></div>

  <div id="app">
    <!-- 顶部极简导航 -->
    <header class="topbar glass">
      <div class="topbar-left">
        <span class="brand-dot"></span>
        <div class="room-info">
          <span class="room-title" id="room-title-text">对话</span>
          <span class="room-subtitle" id="room-members-text"></span>
        </div>
      </div>
      <nav class="topbar-nav">
        <button class="nav-btn" onclick="openModal('char-modal')">角色</button>
        <button class="nav-btn" onclick="openModal('world-modal')">世界</button>
        <button class="nav-btn" id="memory-nav-btn" onclick="openModal('memory-modal')">记忆</button>
        <button class="nav-btn" onclick="openModal('settings-modal')">设置</button>
      </nav>
    </header>

    <!-- 消息列表 -->
    <main id="chat-container" onclick="handleContainerClick(event)"></main>

    <!-- 底部输入区 -->
    <footer class="bottom-area">
      <div class="speaker-strip" id="speaker-strip"></div>
      <div class="input-capsule glass">
        <textarea id="user-input" rows="1" placeholder="输入对话或行动（*星号* 表示神态动作）"></textarea>
        <button class="icon-circle-btn" id="send-or-stop-btn" onclick="handleSendOrStop()" title="发送">
          <svg id="send-icon" viewBox="0 0 24 24">
            <path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z"/>
          </svg>
        </button>
      </div>
    </footer>
  </div>

  <!-- 1. 角色卡弹窗 -->
  <div class="modal-mask" id="char-modal">
    <div class="modal-card">
      <div class="modal-header">
        <span class="modal-title">角色管理与编队</span>
        <button class="close-btn" onclick="closeModal('char-modal')">关闭</button>
      </div>
      <div class="modal-body">
        <div class="note">
          支持导入酒馆标准 JSON、自定义 JSON 或 TXT/MD 角色设定。支持自动替换 <code>{{user}}</code> 与 <code>{{char}}</code>。
        </div>
        <div class="btn-group">
          <button class="btn primary" onclick="openCharEditor(null)">新建角色</button>
          <button class="btn" onclick="document.getElementById('char-file-input').click()">导入 JSON / TXT</button>
          <button class="btn" onclick="exportAllCharacters()">导出备份</button>
          <input type="file" id="char-file-input" accept=".json,.txt,.md" multiple style="display:none" onchange="importCharacterFiles(event)" />
        </div>

        <!-- 角色编辑表单 -->
        <div id="char-editor-panel" style="display:none;background:var(--bg-base);padding:14px;border-radius:var(--radius-lg);border:1px solid var(--glass-border-strong);flex-direction:column;gap:10px;">
          <div style="font-size:13.5px;font-weight:600;color:var(--accent);" id="char-editor-title">编辑角色</div>
          <input type="hidden" id="edit-char-id" />
          <div class="field">
            <label>名称 (name)</label>
            <input class="input" id="edit-char-name" placeholder="例如：凯尔 / 旁白" />
          </div>
          <div class="field">
            <label>头像 (URL 或本地图片自动压缩)</label>
            <div style="display:flex;gap:8px;">
              <input class="input" id="edit-char-avatar" placeholder="https://... 或点击右侧选择图片" />
              <button class="btn" style="flex-shrink:0;" onclick="document.getElementById('avatar-upload-input').click()">选图</button>
              <input type="file" id="avatar-upload-input" accept="image/*" style="display:none" onchange="handleAvatarUpload(event)" />
            </div>
          </div>
          <div class="field">
            <label>人物设定与性格特征 (description / personality)</label>
            <textarea class="textarea" id="edit-char-desc" placeholder="体型外貌、性格特征、背景经历、与玩家的关系..."></textarea>
          </div>
          <div class="field">
            <label>扮演指令与文风要求 (system_prompt)</label>
            <textarea class="textarea" id="edit-char-prompt" placeholder="说话语气、动作细节描写要求..."></textarea>
          </div>
          <div class="field">
            <label>开场白 (first_mes)</label>
            <textarea class="textarea" id="edit-char-firstmes" placeholder="进入房间或重开时的初始台词..."></textarea>
          </div>
          <div class="btn-group">
            <button class="btn primary" onclick="saveCharacterFromEditor()">保存</button>
            <button class="btn" onclick="document.getElementById('char-editor-panel').style.display='none'">取消</button>
          </div>
        </div>

        <div id="char-list-container" style="display:flex;flex-direction:column;gap:10px;"></div>
      </div>
    </div>
  </div>

  <!-- 2. 世界观与文游设定弹窗 -->
  <div class="modal-mask" id="world-modal">
    <div class="modal-card">
      <div class="modal-header">
        <span class="modal-title">世界观与玩家设定</span>
        <button class="close-btn" onclick="closeModal('world-modal')">关闭</button>
      </div>
      <div class="modal-body">
        <div class="btn-group">
          <button class="btn" onclick="document.getElementById('world-file-input').click()">导入世界书 (.json/.txt/.md)</button>
          <button class="btn" onclick="exportWorldbook()">导出世界观</button>
          <input type="file" id="world-file-input" accept=".json,.txt,.md" style="display:none" onchange="importWorldFile(event)" />
        </div>

        <div class="field">
          <label>你的称呼 ({{user}})</label>
          <input class="input" id="user-name-input" placeholder="玩家姓名或代号" />
        </div>

        <div class="field">
          <label>你的人物设定 (User Persona)</label>
          <textarea class="textarea" id="user-persona-input" style="min-height:64px;" placeholder="你在故事中的身份、外貌、能力或与角色的关系..."></textarea>
        </div>

        <div class="field">
          <label>常驻世界观大纲 / 文游规则</label>
          <textarea class="textarea" id="world-global-input" style="min-height:110px;" placeholder="世界背景、当前场景、叙事风格或状态栏规则..."></textarea>
        </div>

        <div class="field">
          <label>关键词动态词条 (JSON 数组，提及关键词时才注入上下文，节省 Token)</label>
          <textarea class="textarea" id="world-entries-input" style="min-height:90px;font-family:monospace;font-size:12px;"></textarea>
        </div>

        <button class="btn primary" onclick="saveWorldSettings()">保存设定</button>
      </div>
    </div>
  </div>

  <!-- 3. 上下文记忆压缩弹窗 (防 Token 爆炸核心) -->
  <div class="modal-mask" id="memory-modal">
    <div class="modal-card">
      <div class="modal-header">

        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');

      return String(str || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

        .replace(/\{\{char\}\}/gi, cName)
