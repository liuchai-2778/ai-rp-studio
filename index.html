<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>RP Studio</title>
  <style>
    :root {
      --bg: #131314;
      --surface: #1e1f20;
      --elevated: #282a2c;
      --glass: rgba(30, 31, 32, 0.78);
      --modal: rgba(24, 25, 27, 0.95);
      --border: rgba(255, 255, 255, 0.09);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text: #e3e3e3;
      --sub: #9aa0a6;
      --muted: #6e747a;
      --accent: #a8c7fa;
      --accent-bg: rgba(168, 199, 250, 0.15);
      --danger: #f28b82;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%; height: 100dvh; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
      font-size: 15px; line-height: 1.6;
    }
    #app-bg { position: fixed; inset: 0; z-index: 0; background: var(--bg) center/cover no-repeat; }
    #app-bg::after { content: ""; position: absolute; inset: 0; background: rgba(19, 19, 20, 0.74); }
    #app {
      position: relative; z-index: 1; display: flex; flex-direction: column;
      width: 100%; height: 100%; height: 100dvh; max-width: 820px; margin: 0 auto;
    }
    .glass {
      background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
    }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; margin: 8px 10px 0; border-radius: 999px; flex-shrink: 0;
    }
    .topbar-left { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
    .room-title { font-size: 14px; font-weight: 600; white-space: nowrap; }
    .room-sub { font-size: 11.5px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nav-btns { display: flex; gap: 2px; flex-shrink: 0; }
    .nav-btn {
      background: transparent; border: 1px solid transparent; color: var(--sub);
      padding: 5px 10px; border-radius: 999px; font-size: 13px; cursor: pointer;
    }
    .nav-btn:active { color: var(--text); background: rgba(255,255,255,0.08); }
    .nav-btn.hl { color: var(--accent); background: var(--accent-bg); }
    #chat-container {
      flex: 1; overflow-y: auto; padding: 16px 14px 20px;
      display: flex; flex-direction: column; gap: 16px; -webkit-overflow-scrolling: touch;
    }
    .divider { text-align: center; font-size: 11px; color: var(--muted); padding: 4px 0; border-bottom: 1px dashed var(--border); }
    .msg-row { display: flex; gap: 10px; align-items: flex-start; }
    .msg-row.archived { opacity: 0.5; }
    .msg-row.user { flex-direction: row-reverse; }
    .msg-row.narrator { justify-content: center; }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%; object-fit: cover;
      background: var(--elevated); border: 1px solid var(--border-strong);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600; color: var(--accent); flex-shrink: 0;
    }
    .msg-main { max-width: calc(100% - 46px); display: flex; flex-direction: column; gap: 4px; }
    .msg-row.user .msg-main { align-items: flex-end; max-width: 82%; }
    .msg-row.narrator .msg-main { max-width: 96%; width: 100%; }
    .msg-sender { font-size: 12px; color: var(--sub); padding: 0 4px; }
    .bubble {
      padding: 10px 15px; border-radius: 18px; font-size: 15px; line-height: 1.65;
      color: var(--text); word-break: break-word; white-space: pre-wrap; cursor: pointer;
      background: rgba(30, 31, 32, 0.7); border: 1px solid var(--border);
    }
    .msg-row.char .bubble { border-top-left-radius: 6px; }
    .msg-row.user .bubble { background: #2b2d30; border-color: var(--border-strong); border-top-right-radius: 6px; }
    .msg-row.narrator .bubble { background: rgba(38, 40, 44, 0.55); border-radius: 12px; color: #c4c7c5; font-size: 14px; }
    .bubble em.act { color: var(--sub); font-style: italic; }
    .msg-actions { display: none; gap: 12px; padding: 2px 6px 0; }
    .msg-row.selected .msg-actions { display: flex; }
    .msg-row.selected .bubble { border-color: var(--accent); }
    .act-btn { background: none; border: none; color: var(--sub); font-size: 12px; cursor: pointer; }
    .act-btn.danger { color: var(--danger); }
    .bottom-area { padding: 6px 10px 10px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
    .strip { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 0 2px; }
    .strip::-webkit-scrollbar { display: none; }
    .chip {
      padding: 4px 12px; border-radius: 999px; font-size: 12px; color: var(--sub);
      background: var(--surface); border: 1px solid var(--border); cursor: pointer; white-space: nowrap;
    }
    .chip.active { color: #0b121e; background: var(--accent); border-color: var(--accent); font-weight: 600; }
    .chip.ghost { color: var(--accent); background: var(--accent-bg); }
    .input-box { display: flex; align-items: flex-end; gap: 8px; padding: 8px 10px 8px 16px; border-radius: 26px; }
    #user-input {
      flex: 1; background: transparent; border: none; outline: none; color: var(--text);
      font-size: 15px; line-height: 1.5; max-height: 110px; min-height: 24px; resize: none; font-family: inherit;
    }
    .send-btn {
      width: 34px; height: 34px; border-radius: 50%; border: none;
      background: var(--accent); color: #0b121e; font-weight: 700; font-size: 13px;
      display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
    }
    .send-btn.stop { background: var(--danger); color: #1f0909; }
    .modal-mask {
      position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.65);
      backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; padding: 12px;
    }
    .modal-mask.show { display: flex; }
    .modal-card {
      width: 100%; max-width: 540px; max-height: 86dvh; background: var(--modal);
      border: 1px solid var(--border-strong); border-radius: 22px; display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-head {
      padding: 14px 18px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-title { font-size: 15px; font-weight: 600; }
    .close-btn { background: none; border: none; color: var(--sub); font-size: 13px; cursor: pointer; padding: 4px 8px; }
    .modal-body { padding: 16px 18px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 12px; color: var(--sub); }
    .input, .textarea {
      width: 100%; background: var(--surface); border: 1px solid var(--border-strong);
      border-radius: 10px; padding: 9px 12px; color: var(--text); font-size: 14px; font-family: inherit; outline: none;
    }
    .textarea { min-height: 80px; resize: vertical; line-height: 1.5; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn {
      background: var(--elevated); border: 1px solid var(--border-strong); color: var(--text);
      padding: 7px 14px; border-radius: 999px; font-size: 13px; cursor: pointer;
    }
    .btn.primary { background: var(--accent); color: #0b121e; border-color: var(--accent); font-weight: 600; }
    .btn.danger { background: rgba(242,139,130,0.14); color: var(--danger); border-color: rgba(242,139,130,0.3); }
    .card-item {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 12px; display: flex; flex-direction: column; gap: 8px;
    }
    .note { font-size: 12px; color: var(--sub); background: rgba(255,255,255,0.04); padding: 10px; border-radius: 10px; }
  </style>
  <script>
    window.onerror = function(msg, url, line) {
      alert("代码粘贴可能不完整，脚本报错 (第 " + line + " 行): " + msg);
    };
  </script>
</head>
<body>
  <div id="app-bg"></div>
  <div id="app">
    <header class="topbar glass">
      <div class="topbar-left">
        <span class="dot"></span>
        <span class="room-title" id="room-title-text">未就绪</span>
        <span class="room-sub" id="room-members-text">若一直显示此字说明底部代码未粘贴完整</span>
      </div>
      <nav class="nav-btns">
        <button class="nav-btn" type="button" onclick="openModal('char-modal')">角色</button>
        <button class="nav-btn" type="button" onclick="openModal('world-modal')">世界</button>
        <button class="nav-btn" type="button" id="memory-nav-btn" onclick="openModal('memory-modal')">记忆</button>
        <button class="nav-btn" type="button" onclick="openModal('settings-modal')">设置</button>
      </nav>
    </header>

    <main id="chat-container" onclick="clearSelection()"></main>

    <footer class="bottom-area">
      <div class="strip" id="speaker-strip"></div>
      <div class="input-box glass">
        <textarea id="user-input" rows="1" placeholder="输入对话或行动（*星号* 表示神态动作）"></textarea>
        <button class="send-btn" type="button" id="send-btn" onclick="handleSendOrStop()">↑</button>
      </div>
    </footer>
  </div>

  <!-- 角色弹窗 -->
  <div class="modal-mask" id="char-modal">
    <div class="modal-card">
      <div class="modal-head">
        <span class="modal-title">角色管理与编队</span>
        <button class="close-btn" type="button" onclick="closeModal('char-modal')">关闭</button>
      </div>
      <div class="modal-body">
        <div class="btn-row">
          <button class="btn primary" type="button" onclick="openCharEditor(null)">新建角色</button>
          <button class="btn" type="button" onclick="document.getElementById('char-file-input').click()">导入 JSON / TXT</button>
          <button class="btn" type="button" onclick="exportAllCharacters()">导出备份</button>
          <input type="file" id="char-file-input" accept=".json,.txt,.md" multiple style="display:none" onchange="importCharacterFiles(event)" />
        </div>
        <div id="char-editor-panel" style="display:none;background:var(--bg);padding:12px;border-radius:14px;border:1px solid var(--border-strong);flex-direction:column;gap:8px;">
          <input type="hidden" id="edit-char-id" />
          <div class="field"><label>名称</label><input class="input" id="edit-char-name" /></div>
          <div class="field"><label>设定与性格 (description)</label><textarea class="textarea" id="edit-char-desc"></textarea></div>
          <div class="field"><label>扮演指令 (system_prompt)</label><textarea class="textarea" id="edit-char-prompt"></textarea></div>
          <div class="field"><label>开场白 (first_mes)</label><textarea class="textarea" id="edit-char-firstmes"></textarea></div>
          <div class="btn-row">
            <button class="btn primary" type="button" onclick="saveCharacterFromEditor()">保存</button>
            <button class="btn" type="button" onclick="document.getElementById('char-editor-panel').style.display='none'">取消</button>
          </div>
        </div>
        <div id="char-list-container" style="display:flex;flex-direction:column;gap:8px;"></div>
      </div>
    </div>
  </div>

  <!-- 世界观弹窗 -->
  <div class="modal-mask" id="world-modal">
    <div class="modal-card">
      <div class="modal-head">
        <span class="modal-title">世界观与玩家设定</span>
        <button class="close-btn" type="button" onclick="closeModal('world-modal')">关闭</button>
      </div>
      <div class="modal-body">
        <div class="btn-row">
          <button class="btn" type="button" onclick="document.getElementById('world-file-input').click()">导入世界观文件</button>
          <input type="file" id="world-file-input" accept=".json,.txt,.md" style="display:none" onchange="importWorldFile(event)" />
        </div>
        <div class="field"><label>你的称呼 ({{user}})</label><input class="input" id="user-name-input" /></div>
        <div class="field"><label>你的设定 (User Persona)</label><textarea class="textarea" id="user-persona-input"></textarea></div>
        <div class="field"><label>全局世界观与文游规则</label><textarea class="textarea" id="world-global-input"></textarea></div>
        <div class="field"><label>关键词动态词条 (JSON)</label><textarea class="textarea" id="world-entries-input" style="font-family:monospace;font-size:12px;"></textarea></div>
        <button class="btn primary" type="button" onclick="saveWorldSettings()">保存设定</button>
      </div>
    </div>
  </div>

  <!-- 记忆压缩弹窗 -->
  <div class="modal-mask" id="memory-modal">
    <div class="modal-card">
      <div class="modal-head">
        <span class="modal-title">上下文压缩与记忆摘要</span>
        <button class="close-btn" type="button" onclick="closeModal('memory-modal')">关闭</button>
      </div>
      <div class="modal-body">
        <div class="note" id="memory-status-note"></div>
        <div class="btn-row">
          <button class="btn primary" type="button" id="compress-btn" onclick="compressOldContext(false)">立即调用 AI 压缩早期对话</button>
          <button class="btn" type="button" onclick="unarchiveAllMessages()">恢复全部归档</button>
        </div>
        <div class="field">
          <label>保留最近对话条数（更早的对话将被压缩为摘要，防 Token 爆炸）</label>
          <input class="input" type="number" id="keep-recent-input" value="10" />
        </div>
        <div class="field">
          <label>常驻前情提要 / 剧情摘要</label>
          <textarea class="textarea" id="story-summary-input" style="min-height:130px;"></textarea>
        </div>
        <button class="btn primary" type="button" onclick="saveMemorySettings()">保存记忆设置</button>
      </div>
    </div>
  </div>

  <!-- 设置弹窗 -->
  <div class="modal-mask" id="settings-modal">
    <div class="modal-card">
      <div class="modal-head">
        <span class="modal-title">接口与全局设置</span>
        <button class="close-btn" type="button" onclick="closeModal('settings-modal')">关闭</button>
      </div>
      <div class="modal-body">
        <div class="btn-row">
          <button class="btn" type="button" onclick="fillPreset('https://api.deepseek.com/v1','deepseek-chat')">DeepSeek V3</button>
          <button class="btn" type="button" onclick="fillPreset('https://api.deepseek.com/v1','deepseek-reasoner')">DeepSeek R1</button>
          <button class="btn" type="button" onclick="fillPreset('https://api.siliconflow.cn/v1','deepseek-ai/DeepSeek-V3')">硅基流动</button>
        </div>
        <div class="field"><label>API Base URL</label><input class="input" id="api-url-input" /></div>
        <div class="field"><label>API Key</label><input class="input" type="password" id="api-key-input" placeholder="sk-..." /></div>
        <div class="field"><label>Model</label><input class="input" id="api-model-input" /></div>
        <div class="field"><label>Temperature</label><input class="input" type="number" step="0.05" id="api-temp-input" /></div>
        <div class="btn-row">
          <button class="btn" type="button" onclick="exportChatHistory()">导出存档</button>
          <button class="btn danger" type="button" onclick="clearChatHistory()">清空重开</button>
        </div>
        <button class="btn primary" type="button" onclick="saveApiSettings()">保存设置</button>
      </div>
    </div>
  </div>

  <!-- 编辑弹窗 -->
  <div class="modal-mask" id="text-editor-modal">
    <div class="modal-card">
      <div class="modal-head">
        <span class="modal-title" id="text-editor-title">编辑</span>
        <button class="close-btn" type="button" onclick="closeModal('text-editor-modal')">取消</button>
      </div>
      <div class="modal-body">
        <textarea class="textarea" id="text-editor-textarea" style="min-height:140px;"></textarea>
        <button class="btn primary" type="button" onclick="confirmTextEditorModal()">确认</button>
      </div>
    </div>
  </div>

  <script>
    var DEFAULT_CHARS = [
      {
        id: 'char_kael',
        name: '凯尔',
        description: '成年男性黑豹兽人，身高近两米，覆着紧实油亮的黑毛，肩背宽阔，体格极具爆发力与压迫感。暗金色竖瞳，左耳有一道旧伤缺口，黑豹长尾低垂摆动。前边境精锐斥候，现为独行佣兵。性格沉稳冷峻、寡言重诺，对认可的搭档极为护短。',
        system_prompt: '你扮演男性黑豹兽人「凯尔」。说话简练低沉，善于通过黑豹兽耳的转动、金色竖瞳的收缩、长尾的摆动或喉咙低吼展现情绪变化。神态动作请放在 *星号* 之间。',
        first_mes: '*篝火噼啪作响，高大的黑豹兽人坐在阴影与火光的交界处，正用鹿皮慢条斯理地擦拭着战术直刀。听到脚步声，他那只带着旧伤缺口的黑色兽耳微微一动，暗金色的竖瞳抬起看向你，身后的长尾在地面上轻轻扫过* 醒了？守夜算我的，把水囊拿去，半小时后出发。',
        inRoom: true
      },
      {
        id: 'char_narrator',
        name: '旁白',
        description: '负责客观推进文游剧情、描绘环境氛围、判定行动结果以及扮演其它NPC的叙事者。',
        system_prompt: '你是文游的客观旁白与DM。请用克制、有画面感的笔触描绘场景与剧情发展，绝不代替玩家说话或做决定。',
        first_mes: '夜色笼罩着荒原边缘的旧营地，冷风掠过枯草，远处的山脊在月光下显出沉默的轮廓。',
        inRoom: true
      }
    ];

    var DEFAULT_STATE = {
      api: { baseUrl: 'https://api.deepseek.com/v1', apiKey: '', model: 'deepseek-chat', temperature: 0.85 },
      memory: { summary: '', keepRecent: 10 },
      user: { name: '搭档', persona: '与凯尔同行的搭档，正在共同执行横跨荒原的委托。' },
      world: { globalPrompt: '硬派奇幻冒险世界，注重环境氛围与兽人动作细节描写。', entries: [] },
      activeSpeakerId: 'char_kael',
      characters: DEFAULT_CHARS,
      messages: [
        { id: 'm1', role: 'narrator', senderId: 'char_narrator', senderName: '旁白', content: DEFAULT_CHARS[1].first_mes, archived: false },
        { id: 'm2', role: 'char', senderId: 'char_kael', senderName: '凯尔', content: DEFAULT_CHARS[0].first_mes, archived: false }
      ]
    };

    var STORAGE_KEY = 'RP_STUDIO_V4';
    var state = loadState();
    var isGenerating = false;
    var abortCtrl = null;
    var selectedIdx = -1;
    var editorMode = { type: 'edit', index: -1 };

    function loadState() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
        var p = JSON.parse(raw);
        return {
          api: p.api || DEFAULT_STATE.api,
          memory: p.memory || DEFAULT_STATE.memory,
          user: p.user || DEFAULT_STATE.user,
          world: p.world || DEFAULT_STATE.world,
          activeSpeakerId: p.activeSpeakerId || 'char_kael',
          characters: p.characters || DEFAULT_CHARS,
          messages: p.messages || DEFAULT_STATE.messages
        };
      } catch (e) {
        return JSON.parse(JSON.stringify(DEFAULT_STATE));
      }
    }

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    }

    function esc(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function macros(text, charName) {
      var u = state.user.name || '搭档';
      var c = charName || '角色';
      return String(text || '').replace(/\{\{user\}\}/gi, u).replace(/\{\{char\}\}/gi, c);
    }

    function getChar(id) {
      for (var i = 0; i < state.characters.length; i++) {
        if (state.characters[i].id === id) return state.characters[i];
      }
      return null;
    }

    function renderAll() {
      var inRoom = state.characters.filter(function(c) { return c.inRoom; });
      document.getElementById('room-title-text').textContent = inRoom.map(function(c) { return c.name; }).join(' · ') || '无角色';
      var activeCnt = state.messages.filter(function(m) { return !m.archived; }).length;
      document.getElementById('room-members-text').textContent = state.memory.summary ? '摘要已启用' : ('上下文 ' + activeCnt + ' 条');

      var strip = document.getElementById('speaker-strip');
      strip.innerHTML = '';
      if (inRoom.length > 0 && !inRoom.some(function(c) { return c.id === state.activeSpeakerId; })) {
        state.activeSpeakerId = inRoom[0].id;
      }
      inRoom.forEach(function(c) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'chip' + (c.id === state.activeSpeakerId ? ' active' : '');
        b.textContent = c.name;
        b.onclick = function() { state.activeSpeakerId = c.id; saveState(); renderAll(); };
        strip.appendChild(b);
      });
      var cont = document.createElement('button');
      cont.type = 'button';
      cont.className = 'chip ghost';
      cont.textContent = '让TA接话';
      cont.onclick = function() { triggerReply(state.activeSpeakerId); };
      strip.appendChild(cont);

      var nar = document.createElement('button');
      nar.type = 'button';
      nar.className = 'chip';
      nar.textContent = '+ 旁白';
      nar.onclick = function() { openEditor('narrator', -1); };
      strip.appendChild(nar);

      var box = document.getElementById('chat-container');
      box.innerHTML = '';
      var divShown = false;
      var hasArch = state.messages.some(function(m) { return m.archived; });

      state.messages.forEach(function(m, idx) {
        if (hasArch && !m.archived && !divShown && idx > 0) {
          divShown = true;
          var d = document.createElement('div');
          d.className = 'divider';
          d.textContent = '以上对话已提炼至「记忆」摘要，不再消耗 Token';
          box.appendChild(d);
        }
        var isNar = m.role === 'narrator' || m.senderName === '旁白';
        var rType = m.role === 'user' ? 'user' : (isNar ? 'narrator' : 'char');
        var row = document.createElement('div');
        row.className = 'msg-row ' + rType + (m.archived ? ' archived' : '') + (selectedIdx === idx ? ' selected' : '');

        var sName = m.role === 'user' ? (state.user.name || '你') : (m.senderName || '角色');
        var av = rType === 'narrator' ? '' : '<div class="avatar">' + esc(sName.slice(0, 1)) + '</div>';
        var bodyHtml = esc(macros(m.content, sName)).replace(/\*([^*]+)\*/g, '<em class="act">*$1*</em>');

        row.innerHTML = av +
          '<div class="msg-main">' +
            '<div class="msg-sender">' + esc(sName) + (m.archived ? ' · 已归档' : '') + '</div>' +
            '<div class="bubble" onclick="selectMsg(' + idx + ', event)">' + bodyHtml + '</div>' +
            '<div class="msg-actions">' +
              (rType !== 'user' ? '<button class="act-btn" type="button" onclick="rerollMsg(' + idx + ', event)">重生成</button>' : '') +
              '<button class="act-btn" type="button" onclick="openEditor(\'edit\',' + idx + ', event)">编辑</button>' +
              '<button class="act-btn" type="button" onclick="rollbackMsg(' + idx + ', event)">回档至此</button>' +
              '<button class="act-btn danger" type="button" onclick="deleteMsg(' + idx + ', event)">删除</button>' +
            '</div>' +
          '</div>';
        box.appendChild(row);
      });
      box.scrollTop = box.scrollHeight;
    }

    function selectMsg(idx, e) {
      if (e) e.stopPropagation();
      selectedIdx = (selectedIdx === idx) ? -1 : idx;
      renderAll();
    }
    function clearSelection() {
      if (selectedIdx !== -1) { selectedIdx = -1; renderAll(); }
    }

    function handleSendOrStop() {
      if (isGenerating) {
        if (abortCtrl) abortCtrl.abort();
        return;
      }
      var inp = document.getElementById('user-input');
      var txt = inp.value.trim();
      if (!txt) {
        triggerReply(state.activeSpeakerId);
        return;
      }
      inp.value = '';
      state.messages.push({
        id: 'm_' + Date.now(), role: 'user', senderId: 'user',
        senderName: state.user.name || '搭档', content: txt, archived: false
      });
      saveState();
      renderAll();
      triggerReply(state.activeSpeakerId);
    }

    async function triggerReply(charId) {
      if (isGenerating) return;
      var sp = getChar(charId) || state.characters.find(function(c) { return c.inRoom; });
      if (!sp) { openModal('char-modal'); return; }
      if (!state.api.apiKey) {
        openModal('settings-modal');
        alert('请先在「设置」中填入 API Key（如 DeepSeek Key）并点击保存。');
        return;
      }

      isGenerating = true;
      abortCtrl = new AbortController();
      var btn = document.getElementById('send-btn');
      btn.classList.add('stop');
      btn.textContent = '■';

      var tempMsg = {
        id: 'm_' + Date.now(),
        role: sp.name === '旁白' ? 'narrator' : 'char',
        senderId: sp.id, senderName: sp.name, content: '...', archived: false
      };
      state.messages.push(tempMsg);
      renderAll();

      try {
        var apiMsgs = buildMessages(sp);
        var url = state.api.baseUrl.replace(/\/+$/, '');
        if (url.indexOf('/chat/completions') === -1) url += '/chat/completions';

        var res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + state.api.apiKey.trim() },
          body: JSON.stringify({
            model: state.api.model || 'deepseek-chat',
            messages: apiMsgs,
            temperature: Number(state.api.temperature) || 0.85,
            stream: false
          }),
          signal: abortCtrl.signal
        });

        if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + (await res.text()));
        var data = await res.json();
        var reply = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '（无内容）';
        tempMsg.content = reply.trim();
      } catch (err) {
        tempMsg.content = err.name === 'AbortError' ? '[已停止]' : ('请求失败：' + err.message);
      } finally {
        isGenerating = false;
        abortCtrl = null;
        btn.classList.remove('stop');
        btn.textContent = '↑';
        saveState();
        renderAll();
      }
    }

    function buildMessages(sp) {
      var active = state.messages.slice(0, -1).filter(function(m) { return !m.archived; });
      var sys = [
        '[世界观]\n' + macros(state.world.globalPrompt, sp.name),
        state.memory.summary ? ('[前情提要]\n' + macros(state.memory.summary, sp.name)) : '',
        '[玩家设定 (' + (state.user.name || '搭档') + ')]\n' + macros(state.user.persona, sp.name),
        '[你当前扮演的角色]\n名称：' + sp.name + '\n设定：' + macros(sp.description, sp.name) + '\n指令：' + macros(sp.system_prompt, sp.name) + '\n严禁代替玩家发言。'
      ].filter(Boolean).join('\n\n');

      var turns = [];
      active.forEach(function(m) {
        var r = (m.role !== 'user' && m.senderId === sp.id) ? 'assistant' : 'user';
        var c = m.role === 'user' ? ((state.user.name || '搭档') + '：' + m.content) : (r === 'assistant' ? m.content : ('[' + m.senderName + ']：' + m.content));
        if (turns.length > 0 && turns[turns.length - 1].role === r) {
          turns[turns.length - 1].content += '\n\n' + c;
        } else {
          turns.push({ role: r, content: c });
        }
      });

      if (turns.length === 0 || turns[turns.length - 1].role === 'assistant') {
        turns.push({ role: 'user', content: '[请继续以 ' + sp.name + ' 的身份回应]' });
      }
      if (turns[0].role === 'assistant') {
        turns.unshift({ role: 'user', content: '[开始]' });
      }
      return [{ role: 'system', content: sys }].concat(turns);
    }

    async function compressOldContext() {
      if (!state.api.apiKey) { alert('请先在设置中配置 API Key'); return; }
      var keep = Math.max(2, parseInt(document.getElementById('keep-recent-input').value, 10) || 10);
      var unarch = [];
      state.messages.forEach(function(m, i) { if (!m.archived) unarch.push(i); });
      if (unarch.length <= keep) { alert('当前未归档消息不多，无需压缩。'); return; }

      var toComp = unarch.slice(0, unarch.length - keep);
      var textBlock = toComp.map(function(i) { return state.messages[i].senderName + '：' + state.messages[i].content; }).join('\n');
      var btn = document.getElementById('compress-btn');
      btn.textContent = '提炼中...';

      try {
        var url = state.api.baseUrl.replace(/\/+$/, '') + '/chat/completions';
        var res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + state.api.apiKey.trim() },
          body: JSON.stringify({
            model: 'deepseek-chat',
            messages: [{ role: 'user', content: '请将以下前情与对话合并提炼为250字以内的文游剧情摘要：\n已有摘要：' + (state.memory.summary || '无') + '\n新增对话：\n' + textBlock }]
})
});
